# Eon Agent 配置文件
# 对应技术方案第 8 节「配置参数总表」

llm:
  provider: "mimo"
  base_url: "https://token-plan-cn.xiaomimimo.com/v1"
  api_key: "${LLM_API_KEY}"            # 从环境变量读取
  model_name: "mimo-v2.5"
  temperature: 0.7
  timeout: 120                          # 秒
  max_tokens: 12800                     # 单次 LLM 响应最大输出 token 数

# 百度千帆 AI Search（web_search 工具使用）
web_search:
  api_key: "${QIANFAN_API_KEY}"         # 从环境变量读取
  search_source: "baidu_search_v2"      # 搜索源
  top_k: 10                             # 返回结果数
  recency_filter: "year"                # 时间过滤：day/week/month/year

# 模式配置（Profile 由 PolicyRouter 自动路由：SIMPLE/TASK）
mode:
  checkpoint_enabled: true             # MVP 阶段关闭 Checkpoint，L2 阶段开启

context:
  max_tokens: 120000
  budget_ratio: 0.7                     # 输入占 70%
  system_prompt_path: "prompts/system_prompt.md"
  pinned_max_tokens: 2048
  insights:
    max_items: 40
    max_chars: 8000
  tail_guard:
    min_tokens: 8000
    min_turns: 3
  compression:
    snip_threshold: 0.65
    prune_threshold: 0.82
    summarize_threshold: 0.95
    snip_keep_chars: 80
    prune_keep_chars: 30
    summary_trigger_messages: 16
    summarize:
      max_input_chars: 50000       # 摘要输入最大字符数（防止超长输入）
      max_output_chars: 2000       # 摘要输出最大字符数

# 会话预算（独立于上下文窗口大小，控制整个会话的累计 token 消耗）
budget:
  max_tokens: 10000000              # 整个会话允许消耗的累计 token 上限
  soft_threshold: 0.75           # 软阈值（75%）：注入 nudge 提示 LLM 收尾
  hard_threshold: 1.0            # 硬阈值（100%）：硬终止
  grace_steps: 3                 # 软阈值触发后给的额外轮次，让 LLM 收尾

loop:
  max_steps: 100
  absolute_max_steps: 160

loop_detect:
  repeat_warn: 3
  repeat_stop: 5
  no_progress_steps: 6
  failure_warn: 3              # 连续失败 3 次注入警告 nudge
  failure_stop: 5              # 连续失败 5 次熔断终止
retry:
  attempts: 3
  min_delay_ms: 500
  max_delay_ms: 5000
  jitter: 0.2

storage:
  base_dir: "./data"            # 会话数据根目录，实际路径: base_dir/{sessionId}/{jsonl,artifacts,...}

tools:
  whitelist:
    - "enable_tools"              # 两阶段懒加载声明工具
    - "todo_write"
    - "todo_read"
    - "working_memory"
    - "finish"
    - "web_search"
    - "web_read"
    - "download"
    - "file_io"
    - "date_time"
  destructive:
    - "download"                   # 通用文件下载，写文件系统
  readonly:
    - "enable_tools"              # 声明工具，无副作用
    - "todo_read"
    - "web_search"
    - "web_read"
    - "date_time"

# MCP 服务配置
mcp:
  servers:
    novel-mcp-server:
      url: "http://localhost:8081/mcp"
      enabled: true                     # 是否启用该 MCP 服务
      permission: "READONLY"            # MCP 工具默认权限