# Eon Agent 配置文件

llm:
  provider: "mimo"                        # LLM 提供商标识
  base_url: "https://token-plan-cn.xiaomimimo.com/v1"  # API 基础地址
  api_key: "${LLM_API_KEY}"               # 从环境变量读取
  model_name: "mimo-v2.5"                 # 模型名称
  temperature: 0.7                        # 采样温度
  timeout: 120                            # 请求超时（秒）
  max_tokens: 12800                       # 单次响应最大输出 token 数

# 百度千帆 AI Search（web_search 工具使用）
web_search:
  api_key: "${QIANFAN_API_KEY}"           # 从环境变量读取
  search_source: "baidu_search_v2"        # 搜索源
  top_k: 10                               # 返回结果数
  recency_filter: "year"                  # 时间过滤：day/week/month/year

mode:
  checkpoint_enabled: true                # 启用 Checkpoint 崩溃恢复

context:
  max_tokens: 120000                      # 上下文窗口大小
  budget_ratio: 0.7                       # 输入 token 占比上限
  system_prompt_path: "prompts/system_prompt.md"  # 系统提示词路径
  compression:
    snip_threshold: 0.65                  # 水位 ≥65%：截短旧工具结果
    prune_threshold: 0.82                 # 水位 ≥82%：替换为占位符
    summarize_threshold: 0.95             # 水位 ≥95%：LLM 摘要并删旧消息

# 会话级 Token 预算（控制整个会话累计消耗）
budget:
  max_tokens: 10000000                    # 会话允许消耗的累计 token 上限
  soft_threshold: 0.75                    # 软阈值（75%）：注入 nudge 提示 LLM 收尾
  hard_threshold: 1.0                     # 硬阈值（100%）：触发优雅停止
  grace_steps: 3                          # 软/硬阈值触发后给的额外轮次

loop:
  max_steps: 100                          # 正常模式最大步数
  absolute_max_steps: 160                 # stop 期间绝对上限

loop_detect:
  repeat_warn: 3                          # 同工具同参数重复 3 次告警
  repeat_stop: 5                          # 重复 5 次判定死循环
  no_progress_steps: 6                    # Todo 连续 6 步无变化告警
  failure_warn: 3                         # 连续失败 3 次注入警告
  failure_stop: 5                         # 连续失败 5 次熔断终止

retry:
  attempts: 3                             # LLM 调用最大重试次数
  min_delay_ms: 500                       # 退避起始延迟
  max_delay_ms: 5000                      # 退避最大延迟
  jitter: 0.2                             # 抖动系数

storage:
  base_dir: "./data"                      # 会话数据根目录: base_dir/{sessionId}/

tools:
  whitelist:                              # 允许注册的本地工具白名单
    - "todo_write"
    - "todo_read"
    - "working_memory"
    - "finish"
    - "web_search"
    - "web_read"
    - "download"
    - "file_io"
    - "date_time"
  destructive:                            # 破坏性工具（写文件系统）
    - "download"
  readonly:                               # 只读工具
    - "todo_read"
    - "web_search"
    - "web_read"
    - "date_time"

# MCP 服务配置
mcp:
  servers:
    novel-mcp-server:
      url: "http://124.111.110.114:8081/mcp"  # MCP 服务端点
      enabled: true                            # 是否启用
      permission: "READONLY"                   # MCP 工具默认权限