# Eon Agent 配置文件
llm:
  provider: "mimo"                        # LLM 提供商标识
  base_url: "https://api.xiaomimimo.com/v1"  # API 基础地址
  api_key: "${LLM_API_KEY}"               # 从环境变量读取
  model_name: "mimo-v2.5"                 # 模型名称
  temperature: 0.7                        # 采样温度
  timeout: 120                            # 请求超时（秒）
  max_tokens: 12000                       # 单次响应最大输出 token 数

# 百度千帆 AI Search（web_search 工具使用）
web_search:
  api_key: "${QIANFAN_API_KEY}"           # 从环境变量读取
  search_source: "baidu_search_v2"        # 搜索源
  top_k: 10                               # 返回结果数
  recency_filter: "year"                  # 时间过滤：day/week/month/year

mode:
  checkpoint_enabled: true                # 启用 Checkpoint 崩溃恢复

context:
  max_tokens: 200000                      # 上下文窗口大小（200K）
  system_prompt_path: "prompts/system_prompt.md"  # 系统提示词路径
  summarize_max_input_chars: 80000        # 摘要输入上限
  snip_keep_chars: 4000                   # Snip 头尾保留字符数（头2000+尾2000）
  summarize_max_output_chars: 3000        # 摘要输出上限（200K 窗口允许更长摘要）
  # 压缩机制：每轮判定一个档位，水位三档优先，轮数周期兜底。
  compression:
    snip_water_level: 0.65                # 水位 ≥65%（~130K）：头尾截断旧工具结果
    prune_water_level: 0.80               # 水位 ≥80%（~160K）：有磁盘副本的块清空为占位符，无副本的退化为头尾截断；工具参数在此档骨架化
    summarize_water_level: 0.92            # 水位 ≥92%（~184K）：LLM 摘要后删除原文
    turn_interval: 7                      # 轮次序号为此值整数倍、且水位三档均未命中时的周期对账点
    turn_level: SNIP                      # 轮数入口命中时执行的档位（只允许 SNIP / PRUNE）
    tail_guard_turns: 3                   # 尾部保护区：最近 3 轮的任何内容都不参与压缩
    offload_min_chars: 2000               # 工具参数 >2000 字符才骨架化；短参数替换后反而更长

# 会话级 Token 预算（控制整个会话累计消耗）
budget:
  max_tokens: 2000000                     # 会话允许消耗的累计 token 上限（≈10 轮完整上下文）
  threshold: 0.75                         # 阈值（75%）：注入 nudge 提示 LLM 收尾

loop:
  max_steps: 100                          # 最大步数

loop_detect:
  repeat_warn: 3                          # 同一轮内同工具同参数重复 3 次告警
  repeat_stop: 5                          # 同一轮内重复 5 次判定死循环
  no_progress_steps: 6                    # Todo 连续 6 步无变化告警
  failure_warn: 3                         # 单工具连续失败 3 次注入警告
  failure_stop: 5                         # 单工具连续失败 5 次熔断该工具

retry:
  attempts: 3                             # LLM 调用最大重试次数
  min_delay_ms: 500                       # 退避起始延迟
  max_delay_ms: 5000                      # 退避最大延迟
  jitter: 0.2                             # 抖动系数

storage:
  base_dir: "./data"                      # 会话数据根目录: base_dir/{sessionId}/

tools:
  whitelist:                              # 允许注册的本地工具白名单（9 个）
    - "read_file"
    - "write"
    - "list_dir"
    - "download_file"
    - "todo_write"
    - "update_memory"
    - "web_fetch"
    - "AskQuestion"
    - "web_search"
  destructive:                            # 破坏性工具（当前无）
  readonly:                               # 只读工具
    - "read_file"
    - "list_dir"
    - "web_search"
    - "web_fetch"
    - "AskQuestion"
  sandbox_enabled: true                   # 路径沙箱开关
  parallelism: 4                          # 并行工具执行线程数
  web_fetch:
    max_content_length: 50000             # web_fetch 内容截断字符数
    cache_ttl_minutes: 15                 # 缓存 TTL（分钟）
    cache_max_entries: 64                 # LRU 缓存上限
  download:
    max_file_size_mb: 100                 # 下载文件大小上限（MB）

memory:
  enabled: true                           # 跨会话记忆开关

# MCP 服务配置
mcp:
  servers:
    reader-mcp-server:
      url: "http://124.223.110.114:8081/mcp"    # MCP 服务端点
      enabled: true                             # 是否启用
      permission: "READONLY"                    # MCP 工具默认权限