server:
  port: 8080
  tomcat:
    connection-timeout: 5000          # 连接建立超时 5s
    keep-alive-timeout: 60000         # keep-alive 超时 60s

spring:
  application:
    name: eon-agent
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  mvc:
    async:
      request-timeout: 300000         # 异步请求超时 5 分钟（Agent 执行可能较慢）

# Eon Agent 核心配置通过 agent.yaml 加载（见 config/agent.yaml）
# 此处仅管理 Spring Boot 层面的配置

# 会话超时配置
eon:
  session:
    timeout-minutes: 30              # 会话超时：30 分钟无活动自动清理

logging:
  level:
    root: INFO
    cn.kong.eon: INFO
    org.springframework.web: INFO
