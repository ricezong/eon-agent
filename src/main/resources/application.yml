server:
  port: 8080

spring:
  application:
    name: eon-agent

logging:
  level:
    cn.kong.eon: INFO
    org.springframework: WARN

# ════════════════════════════════════════════════════════════════════
# Eon Agent 业务配置
# ════════════════════════════════════════════════════════════════════
eon:
  llm:
    provider: "mimo"                        # LLM 提供商标识
    base_url: "https://api.xiaomimimo.com/v1"  # API 基础地址
    api_key: "${LLM_API_KEY}"               # 从环境变量读取
    model_name: "mimo-v2.5"                 # 模型名称
    temperature: 0.7                        # 采样温度
    timeout: 120                            # 请求超时（秒）
    max_tokens: 12000                       # 单次响应最大输出 token 数
    stream_enabled: true                    # 流式响应开关

  # 百度千帆 AI Search（web_search 工具使用）
  # 以下几项是工具参数的缺省值：LLM 调用显式传参时以参数为准，未传时回退到这里
  web_search:
    api_key: "${QIANFAN_API_KEY}"           # 从环境变量读取
    search_source: "baidu_search_v2"        # 搜索源，直传千帆 API
    top_k: 10                               # 工具未传 max_results 时的默认返回条数
    recency_filter: "py"                    # 工具未传 recency_filter 时的默认过滤：pd/pw/pm/py

  mode:
    snapshot_enabled: true                  # 启用会话快照（todo_write 成功时落盘 state.json）

  context:
    max_tokens: 200000                      # 上下文窗口大小（200K）
    system_prompt_path: "prompts/system_prompt.md"  # 系统提示词路径
    summarize_max_input_chars: 80000        # 摘要单段输入上限
    snip_keep_chars: 4000                   # SNIP 档头尾保留字符数
    summarize_max_output_chars: 30000        # 摘要输出上限
    # 大文件落盘（入站阶段，与下面的水位压缩是两套独立机制）
    spill_threshold_chars: 12000            # 工具结果超过此长度才落盘
    spill_keep_chars: 8000                  # 落盘后块里保留的头尾摘要长度
    # 压缩机制：每轮判定一个档位，水位三档优先，轮数周期兜底。
    compression:
      snip_water_level: 0.65                # 水位 ≥65%（~130K）
      prune_water_level: 0.80               # 水位 ≥80%（~160K）
      summarize_water_level: 0.92            # 水位 ≥92%（~184K）
      turn_interval: 7                      # 轮次序号为此值整数倍时的周期对账点
      turn_level: SNIP                      # 轮数入口命中时执行的档位
      tail_guard_blocks: 12                 # 尾部保护区
      args_prune_min_chars: 2000            # 工具参数裁剪阈值

  # 会话级 Token 预算
  budget:
    max_tokens: 2000000                     # 会话允许消耗的累计 token 上限
    threshold: 0.75                         # 阈值（75%）：注入 nudge 提示 LLM 收尾

  loop:
    max_steps: 100                          # 最大步数

  loop_detect:
    repeat_warn: 3                          # 同一轮内同工具同参数重复 3 次告警
    repeat_stop: 5                          # 同一轮内重复 5 次判定死循环
    no_progress_steps: 6                    # Todo 连续 6 步无变化告警
    failure_warn: 3                         # 单工具连续失败 3 次注入警告
    failure_stop: 5                         # 单工具连续失败 5 次熔断该工具

  retry:
    attempts: 3                             # LLM 调用最大重试次数
    min_delay_ms: 500                       # 退避起始延迟
    max_delay_ms: 5000                      # 退避最大延迟
    jitter: 0.2                             # 抖动系数

  storage:
    base_dir: "/home/workspace/sessions"      # 会话数据根目录: base_dir/{sessionId}/
    db_path: "/home/workspace/sessions/eon.db" # SQLite 索引数据库路径

  # 活跃会话上下文缓存（SessionScope）
  session:
    cache:
      maximum_size: 1000                      # 缓存条目上限
      idle_ttl_minutes: 30                    # IDLE 状态空闲 TTL（分钟）
      running_ttl_minutes: 1440               # RUNNING 状态 TTL（分钟），兜底防长任务被淘汰
      busy_policy: REJECT                     # 同会话并发策略：REJECT(抛 409) | QUEUE(排队)
      queue_timeout_seconds: 60               # QUEUE 模式等待前一个任务的最长秒数，超时按 busy 处理

  tools:
    whitelist:                              # 允许注册的本地工具白名单
      - "read_file"
      - "write"
      - "list_dir"
      - "download_file"
      - "todo_write"
      - "update_memory"
      - "web_fetch"
      - "AskQuestion"
      - "web_search"
    sandbox_enabled: true                   # 路径沙箱开关
    parallelism: 4                          # 并行工具执行线程数
    web_fetch:
      max_content_length: 50000             # web_fetch 内容截断字符数
      cache_ttl_minutes: 15                 # 缓存 TTL（分钟）
      cache_max_entries: 64                 # LRU 缓存上限
    download:
      max_file_size_mb: 100                 # 下载文件大小上限（MB）

  # MCP 服务配置
  mcp:
    servers:
      reader-mcp-server:
        url: "http://124.223.110.114:8081/mcp"    # MCP 服务端点
        enabled: true                             # 是否启用
        permission: "READONLY"                    # MCP 工具默认权限
